name: oil_shock
version: "1.0.0"
config-version: 2
profile: oil_shock

model-paths: ["models"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
seed-paths: ["seeds"]
test-paths: ["tests"]

models:
  oil_shock:
    staging:
      +schema: silver
      +materialized: view
    intermediate:
      +schema: silver
      +materialized: view
    marts:
      +schema: gold
      +materialized: table

seeds:
  oil_shock:
    +schema: silver
    ref_countries:
      +column_types:
        opec_member: boolean
        opec_plus_partner: boolean
        hormuz_exporter: boolean
    ref_chokepoints:
      +column_types:
        oil_relevant: boolean
